<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toker Poker Lighters | Pixie's Pantry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #2a2a3e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-body {
            padding: 10px;
        }
        .card-brand {
            font-size: 0.8em;
            color: #888;
        }
        .card-title {
            font-size: 1em;
            margin: 5px 0;
        }
        .card-price {
            font-size: 1.2em;
            color: #d4af37;
            font-weight: bold;
        }
        h1 {
            text-align: center;
            color: #d4af37;
        }
    </style>
</head>
<body>
    <h1>Toker Poker Lighters</h1>
    <div class="grid" id="toker-poker-products">
        <!-- Toker Poker Products -->
        <div class="card" data-name="Standard Bic - Black" data-brand="Toker Poker" data-price="10.99">
            <img src="https://cdn.shopify.com/s/files/1/2665/6390/files/black-with-poker-out---simi-edit.jpg" alt="Standard Bic - Black" class="card-img">
            <div class="card-body">
                <div class="card-brand">Toker Poker</div>
                <div class="card-title">Standard Bic - Black</div>
                <div class="card-price">$10.99</div>
            </div>
        </div>

        <div class="card" data-name="Standard Bic - Carolina" data-brand="Toker Poker" data-price="10.99">
            <img src="https://cdn.shopify.com/s/files/1/2665/6390/files/Carolina-Toker-Poker---front-simi-eidt.jpg" alt="Standard Bic - Carolina" class="card-img">
            <div class="card-body">
                <div class="card-brand">Toker Poker</div>
                <div class="card-title">Standard Bic - Carolina</div>
                <div class="card-price">$10.99</div>

        </div>

        <div class="card" data-name="Standard Bic - Grey" data-brand="Toker Poker" data-price="10.99">

                <div class="card-brand">Toker Poker</div>

            <img src="https://cdn.shopify.com/s/files/1/2665/6390/files/army-with-poker-out---simi-edit.jpg" alt="Standard Bic - Army" class="card-img">
            <div class="card-body">
                <div class="card-brand">Toker Poker</div>
