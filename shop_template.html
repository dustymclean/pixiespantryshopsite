<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Pixie's Pantry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fbfbf9;
            --surface: #fff;
            --ink: #111;
            --muted: #68645f;
            --line: #e5e2dc;
            --blue: #2563eb;
            --gold: #d4af37;
            --soft: #f2efe8;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
        }
        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 22px;
        }
        .topbar {
            border-bottom: 1px solid var(--line);
            background: rgba(251, 251, 249, 0.92);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            min-height: 74px;
        }
        .brand {
            font-weight: 900;
            letter-spacing: -0.04em;
            font-size: 25px;
        }
        .brand small {
            display: block;
            font: 700 10px/1.2 ui-monospace, monospace;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 2px;
        }
        .links {
            display: flex;
            gap: 18px;
            align-items: center;
            font-weight: 750;
            font-size: 14px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: #fff;
            padding: 12px 16px;
            border-radius: 999px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
        }
        .btn.secondary {
            background: #fff;
            color: var(--ink);
            border-color: var(--line);
        }
        .hero {
            padding: 80px 0 56px;
            border-bottom: 1px solid var(--line);
        }
        .h1 {
            font-size: clamp(42px, 7vw, 86px);
            line-height: 0.92;
            letter-spacing: -0.065em;
            margin: 0 0 22px;
            font-weight: 950;
        }
        .lead {
            font-size: 20px;
            color: var(--muted);
            max-width: 720px;
            margin: 0 0 28px;
        }
        .section {
            padding: 62px 0;
            border-bottom: 1px solid var(--line);
        }
        .section h2 {
            font-size: clamp(32px, 5vw, 54px);
            line-height: 1;
            letter-spacing: -0.055em;
            margin: 0 0 14px;
        }
        .sub {
            color: var(--muted);
            font-size: 18px;
            margin: 0 0 28px;
            max-width: 760px;
        }
        .grid {
            display: grid;
            gap: 22px;
        }
        .product-grid {
            grid-template-columns: repeat(3, 1fr);
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.045);
            text-decoration: none;
            color: var(--ink);
        }
        .card:hover {
            border-color: #111;
            transform: translateY(-2px);
            transition: 0.18s ease;
        }
        .price {
            font-weight: 950;
            font-size: 24px;
            letter-spacing: -0.03em;
        }
        .strike {
            text-decoration: line-through;
            color: var(--muted);
            font-size: 14px;
            margin-left: 8px;
        }
        .footer {
            padding: 48px 0;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="wrap nav">
            <a class="brand" href="index.html">Pixie's Pantry<small>Clinical Hardware Registry</small></a>
            <nav class="links">
                <a href="clinical-index.html">Clinical Index</a>
                <a href="shop.html">Shop</a>
                <a href="bundles.html">Bundles</a>
                <a href="audit.html">The Audit</a>
                <a href="build-a-bong.html">Build-A-Bong</a>
                <a href="support.html">Support</a>
            </nav>
            <a class="btn secondary" href="checkout.html">Checkout</a>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="wrap">
                <h1 class="h1">Shop Clinical Hardware</h1>
                <p class="lead">Browse compatibility-checked systems and products by cluster, role, and use case.</p>
            </div>
        </section>

        <section class="section">
            <div class="wrap">
                <div class="grid product-grid">
                    <!-- Products will be injected here by Python -->
                    {{PRODUCT_CARDS}}
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="wrap">
            <p>&copy; 2026 Pixie's Pantry. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
