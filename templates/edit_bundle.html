<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Bundle | Pixie's Pantry Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex">
    <!-- Sidebar -->
    <div class="w-64 bg-white shadow-lg h-screen fixed">
        <div class="p-6">
            <h1 class="text-2xl font-bold">Pixie's Pantry</h1>
            <p class="text-sm text-gray-500">Medical Storefront Dashboard</p>
        </div>
        <nav class="mt-6">
            <a href="/" class="block px-6 py-3 text-gray-600 hover:bg-gray-100">
                📊 Dashboard
            </a>
            <a href="/products" class="block px-6 py-3 text-gray-600 hover:bg-gray-100">
                📦 Products
            </a>
            <a href="/bundles" class="block px-6 py-3 text-blue-600 bg-blue-50 font-semibold">
                🎁 Bundles
            </a>
            <a href="/bulk_edit" class="block px-6 py-3 text-gray-600 hover:bg-gray-100">
                🔧 Bulk Edit
            </a>
            <a href="/market_data" class="block px-6 py-3 text-gray-600 hover:bg-gray-100">
                📈 Market Data
            </a>
            <a href="/deploy" class="block px-6 py-3 text-gray-600 hover:bg-gray-100 mt-6 border-t">
                🚀 Deploy Storefront
            </a>
        </nav>
    </div>
    
    <!-- Main Content -->
    <div class="ml-64 w-full p-8">
        <h1 class="text-3xl font-bold mb-8">Edit Bundle</h1>
        
        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Bundle Name</label>
                <input type="text" name="name" value="{{ bundle['name'] }}" 
                       class="w-full px-3 py-2 border rounded-lg" required />
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea name="description" rows="4" class="w-full px-3 py-2 border rounded-lg" required>
                    {{ bundle['description'] }}
                </textarea>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Price ($)</label>
                <input type="number" name="price" value="{{ bundle['price'] }}" 
                       class="w-full px-3 py-2 border rounded-lg" step="0.01" required />
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Savings (%)</label>
                <input type="number" name="savings" value="{{ bundle['savings'] }}" 
                       class="w-full px-3 py-2 border rounded-lg" min="0" max="100" required />
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Included Products</label>
                <div class="border rounded-lg p-4 max-h-64 overflow-y-auto">
                    {% for product in bundle['products'] %}
                    <div class="flex items-center mb-2">
                        <input type="checkbox" checked disabled class="h-4 w-4 text-blue-600 border-gray-300 rounded" />
                        <span class="ml-2 text-sm">{{ product['name'] }} ({{ product['sku'] }})</span>
                    </div>
                    {% endfor %}
                </div>
            </div>
            
            <div class="flex justify-end space-x-4">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Save Changes
                </button>
                <a href="/bundles" class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</body>
</html>
