<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bulk Edit | Pixie's Pantry Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8">Bulk Edit Products</h1>
        
        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="mb-4">
                <button type="button" id="select-all" class="text-blue-600 hover:underline">Select All</button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead>
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Select</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">SKU</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Price</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cluster</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        {% for product in products %}
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <input type="checkbox" name="selected_skus" value="{{ product['SKU'] }}" class="h-4 w-4 text-blue-600 border-gray-300 rounded" />
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">{{ product['SKU'] }}</td>
                            <td class="px-6 py-4 whitespace-nowrap">{{ product['Medical Product Name'] }}</td>
                            <td class="px-6 py-4 whitespace-nowrap">${{ product['Your Online Price'] }}</td>
                            <td class="px-6 py-4 whitespace-nowrap">{{ product['Clinical Cluster'] }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            
            <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">New Price ($)</label>
                    <input type="number" name="price" class="w-full px-3 py-2 border rounded-lg" step="0.01" placeholder="Leave blank to keep current" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">New Clinical Cluster</label>
                    <select name="cluster" class="w-full px-3 py-2 border rounded-lg">
                        <option value="">Leave blank to keep current</option>
                        {% for cluster in [
                            "Cluster A: Active Electronic TEDs",
                            "Cluster B: Passive/Manual TEDs",
                            "Cluster C: Hydrated Filters",
                            "Cluster D: Botanical Homogenizers",
                            "Cluster E: Atmospheric Preservation Units",
                            "Cluster F: Mass Verification Instruments",
                            "Cluster G: Chemical Sterilization Agents",
                            "Cluster H: Induction Heaters",
                            "Cluster I: Pressure Regulation Hardware",
                            "Cluster J: Clinical Extract Applicators"
                        ] %}
                        <option value="{{ cluster }}">{{ cluster }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="mt-6 flex justify-end space-x-4">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Apply Changes
                </button>
                <a href="/" class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300">
                    Cancel
                </a>
            </div>
        </form>
    </div>
    
    <script>
        document.getElementById('select-all').addEventListener('click', function() {
            const checkboxes = document.querySelectorAll('input[name="selected_skus"]');
            checkboxes.forEach(cb => cb.checked = !cb.checked);
        });
    </script>
</body>
</html>
