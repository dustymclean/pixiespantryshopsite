<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Bundle | Pixie's Pantry Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8">New Bundle</h1>
        
        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Bundle Name</label>
                <input type="text" name="name" class="w-full px-3 py-2 border rounded-lg" required />
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea name="description" rows="4" class="w-full px-3 py-2 border rounded-lg" required></textarea>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Price ($)</label>
                <input type="number" name="price" class="w-full px-3 py-2 border rounded-lg" step="0.01" required />
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Savings (%)</label>
                <input type="number" name="savings" class="w-full px-3 py-2 border rounded-lg" min="0" max="100" required />
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Select Products</label>
                <div class="border rounded-lg p-4 max-h-64 overflow-y-auto">
                    {% for product in products %}
                    <div class="flex items-center mb-2">
                        <input type="checkbox" name="selected_products" value="{{ product['SKU'] }}" 
                               class="h-4 w-4 text-blue-600 border-gray-300 rounded" />
                        <span class="ml-2 text-sm">{{ product['Medical Product Name'] }} ({{ product['SKU'] }})</span>
                    </div>
                    {% endfor %}
                </div>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Brand</label>
                <input type="text" name="brand" class="w-full px-3 py-2 border rounded-lg" required />
            </div>
            
            <div class="flex justify-end space-x-4">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Create Bundle
                </button>
                <a href="/" class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</body>
</html>
