<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Product | Pixie's Pantry Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8">Edit Product</h1>
        
        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Product Name</label>
                <input type="text" name="name" value="{{ product['Medical Product Name'] }}" 
                       class="w-full px-3 py-2 border rounded-lg" required />
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea name="description" rows="4" class="w-full px-3 py-2 border rounded-lg" required>
                    {{ product['Medical Description'] }}
                </textarea>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Price ($)</label>
                <input type="number" name="price" value="{{ product['Your Online Price'] }}" 
                       class="w-full px-3 py-2 border rounded-lg" step="0.01" required />
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Clinical Cluster</label>
                <select name="cluster" class="w-full px-3 py-2 border rounded-lg" required>
                    {% for cluster in [
                        "Cluster A: Active Electronic TEDs",
                        "Cluster B: Passive/Manual TEDs",
                        "Cluster C: Hydrated Filters",
                        "Cluster D: Botanical Homogenizers",
                        "Cluster E: Atmospheric Preservation Units",
                        "Cluster F: Mass Verification Instruments",
                        "Cluster G: Chemical Sterilization Agents",
                        "Cluster H: Induction Heaters",
                        "Cluster I: Pressure Regulation Hardware",
                        "Cluster J: Clinical Extract Applicators"
                    ] %}
                    <option value="{{ cluster }}" {% if product['Clinical Cluster'] == cluster %}selected{% endif %}>
                        {{ cluster }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">SEO Tags</label>
                <input type="text" name="seo_tags" value="{{ product['Medical SEO Tags'] }}" 
                       class="w-full px-3 py-2 border rounded-lg" placeholder="e.g., thermal extraction, clinical, medical-grade" />
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Product Photo</label>
                <img src="{{ product['Image URL'] or 'https://via.placeholder.com/300x200?text=No+Image' }}" 
                     alt="Product Photo" class="w-48 h-48 object-cover mb-2" />
                <input type="file" name="photo" accept="image/*" class="w-full" />
            </div>
            
            <div class="flex justify-end space-x-4">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Save Changes
                </button>
                <a href="/" class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</body>
</html>
